# ABLATION of configs/dpo_hh.yaml: identical except learning_rate (and run name / output dir).
run_name: dpo_hh_lr5e6
sft_checkpoint: outputs/sft/best             # policy init AND frozen reference
train_file: data/processed/hh_train.jsonl  # 15,000 pairs
val_file: data/processed/hh_val.jsonl      # 1,000 pairs
output_dir: outputs/dpo_hh_lr5e6
seed: 42
beta: 0.1
max_length: 512
max_prompt_length: 256
per_device_batch_size: 1
gradient_accumulation_steps: 32              # effective batch 32 pairs
eval_batch_size: 4
optimizer: rmsprop
learning_rate: 5.0e-6                        # ABLATION: 5x the guide value (1e-6)
lr_schedule: constant                        # fixed LR, no decay
warmup_steps: 0
weight_decay: 0.0
max_grad_norm: 1.0
num_epochs: 1
fp16: true
gradient_checkpointing: true
fast_logprobs: true
reference_dtype: float32                     # identical numerics to the policy at step 0
policy_device: auto                          # cuda:0
reference_device: auto                       # cuda:1 when two GPUs are visible
log_every: 5
eval_every: 50
eval_at_start: true
