[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "small-model-alignment"
version = "1.0.0"
description = "SFT + from-scratch DPO + TRL LoRA-DPO on small language models, with pairwise model-based evaluation."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["alignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
